# Builds the .vsix and publishes it to a GitHub release.
#
# Triggered by pushing a tag like v0.1.0. Release assets are free and allow up to 2 GB per
# file, so the ~31 MB package is comfortable; they also do not count against the repository
# storage that applies to private repos.
#
# Note what this does NOT build: the sample UWP app. Packaging needs TypeScript, the .NET SDK
# and the C++ compiler, all of which a hosted Windows runner has. Building the sample would
# need the UWP workload, which it does not, and nothing in the package depends on it.

name: release

on:
  push:
    tags: ['v*']
  # Buildable on demand, so the packaging can be exercised without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci --no-audit --no-fund

      - name: Compile and check
        working-directory: extension
        # Only the parts that do not need a UWP app or a Windows desktop session. The end-to-end
        # loop deploys and launches a packaged app, which a hosted runner cannot do.
        run: |
          npm run compile
          npm test

      - name: Build the .vsix
        run: .\tools\Package-Extension.ps1

      - name: Verify the package carries its native helpers
        shell: pwsh
        # A .vsix that builds but ships without uwplaunch.exe or XamlTap.dll installs cleanly
        # and then fails at the first launch, so this is checked rather than assumed.
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $vsix = Get-ChildItem extension\*.vsix | Select-Object -First 1
          $zip = [System.IO.Compression.ZipFile]::OpenRead($vsix.FullName)
          $entries = $zip.Entries.FullName
          $zip.Dispose()
          foreach ($needed in @('extension/bin/uwplaunch.exe', 'extension/bin/x64/XamlTap.dll')) {
              if ($entries -notcontains $needed) { throw "$needed is missing from $($vsix.Name)" }
              Write-Host "ok: $needed"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: uwp-tools-vsix
          path: extension/*.vsix

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $vsix = Get-ChildItem extension\*.vsix | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $vsix.FullName `
              --title $env:GITHUB_REF_NAME `
              --generate-notes
